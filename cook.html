<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>Cooking — AI Cookbook</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="cook-mode">
    <header class="cook-header">
      <button id="exit-btn" class="cook-exit" aria-label="Exit cooking mode">
        ✕ Exit
      </button>
      <h1 id="cook-title" class="cook-title">Loading…</h1>
      <div class="cook-spacer"></div>
    </header>

    <main class="cook-main">
      <div class="cook-progress">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="step-counter" class="step-counter"></p>
      </div>

      <section class="cook-step">
        <p id="step-text" class="step-text">Loading…</p>
      </section>

      <div id="timer-list" class="timer-list"></div>

      <div class="cook-controls">
        <button id="prev-btn" class="cook-btn" aria-label="Previous step">
          ◀ Back
        </button>
        <button
          id="repeat-btn"
          class="cook-btn primary"
          aria-label="Repeat current step"
        >
          🔁 Repeat
        </button>
        <button id="next-btn" class="cook-btn" aria-label="Next step">
          Next ▶
        </button>
      </div>

      <p id="listening-indicator" class="listening-indicator"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/cook.js"></script>
  </body>
</html>
