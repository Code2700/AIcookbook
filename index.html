<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Cookbook — cook hands-free with voice guidance and scan ingredients with your camera."
    />
    <meta name="theme-color" content="#e85d3d" />
    <title>AI Cookbook</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="container">
        <a href="index.html" class="logo">🍳 AI Cookbook</a>
        <nav class="nav">
          <a href="index.html" class="nav-link">Browse</a>
          <a href="index.html?view=favorites" class="nav-link">Favorites</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>What are we cooking?</h1>
        <p class="hero-subtitle">
          Search thousands of recipes. Cook hands-free in M3. Scan your fridge
          in M4.
        </p>

        <div class="search-bar">
          <input
            type="search"
            id="search-input"
            placeholder="Try 'chicken', 'pasta', 'rice'..."
            autocomplete="off"
            aria-label="Search recipes"
          />
          <button id="surprise-btn" class="btn-surprise" type="button">
            🎲 Surprise me
          </button>
        </div>

        <div
          id="category-chips"
          class="category-chips"
          aria-label="Filter by category"
        ></div>
      </section>

      <p id="status" class="status" hidden></p>

      <section
        id="recipe-grid"
        class="recipe-grid"
        aria-live="polite"
      ></section>
    </main>

    <footer class="app-footer">
      <div class="container">
        <p>
          Built with HTML, CSS &amp; JavaScript. Recipes via
          <a href="https://www.themealdb.com/" target="_blank" rel="noopener"
            >TheMealDB</a
          >.
        </p>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
